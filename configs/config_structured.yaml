# Gemini live-run config. Uses the SAME manifests/labels produced by the mock run.
# Put your key in pipeline/.env  ->  GEMINI_API_KEY=xxxxx   (gitignored)
seed: 20260705

paths:
  archive:      "../archive"
  reports_csv:  "../archive/indiana_reports.csv"
  proj_csv:     "../archive/indiana_projections.csv"
  images_dir:   "../archive/images/images_normalized"
  out_dir:      "results"

dataset:
  strata_targets: {easy_normal: 150, easy_abnormal: 150, intermediate: 150,
                   hard_multi: 150, ambiguous: 150, rare: 100}
  dev_fraction: 0.18
  require_findings: true

inference:
  backend: "gemini"
  model_id: "gemini-2.5-flash"      # vision-capable; cheap/fast for first run
  temperature: 0.0
  image_max_side: 0            # 0 = FULL resolution (#2)
  max_output_tokens: 2048
  media_resolution: "MEDIA_RESOLUTION_HIGH"   # #2: process full image detail
  thinking_budget: 0                # disable hidden CoT (clean prompt contrast)
  max_workers: 8                    # concurrent API calls
  prompts: ["structured"]     # #1: structured multi-label read
  mock: {base_accuracy: 0.72, hallucination_rate: 0.15, miscalibration: 0.12}

judge:
  backend: "gemini"                 # real LLM judge for the full run
  models: ["gemini-2.5-flash"]
  max_workers: 8
  swap_positions: true

stats: {n_bootstrap: 10000, ece_bins: 15, fdr_alpha: 0.05}

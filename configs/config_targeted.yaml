# structured_targeted prompt validation run — per-class discriminators to cut systematic over-calling (bias attack).
# Audit (2026-07-09) showed balanced routes visible-but-subtle findings to 'uncertain'
# (Cardiomegaly/Lung Opacity/Atelectasis = top-3 misses vs CheXbert).
seed: 20260705

paths:
  archive:      "../archive"
  reports_csv:  "../archive/indiana_reports.csv"
  proj_csv:     "../archive/indiana_projections.csv"
  images_dir:   "../archive/images/images_normalized"
  out_dir:      "results"

dataset:
  strata_targets: {easy_normal: 150, easy_abnormal: 150, intermediate: 150,
                   hard_multi: 150, ambiguous: 150, rare: 100}
  dev_fraction: 0.18
  require_findings: true

inference:
  backend: "gemini"
  model_id: "gemini-2.5-flash"
  temperature: 0.0
  image_max_side: 0            # full resolution
  max_output_tokens: 2048
  media_resolution: "MEDIA_RESOLUTION_HIGH"
  thinking_budget: 0
  max_workers: 8
  prompts: ["structured_targeted"]
  mock: {base_accuracy: 0.72, hallucination_rate: 0.15, miscalibration: 0.12}

judge:
  backend: "gemini"
  models: ["gemini-2.5-flash"]
  max_workers: 8
  swap_positions: true

stats: {n_bootstrap: 10000, ece_bins: 15, fdr_alpha: 0.05}
